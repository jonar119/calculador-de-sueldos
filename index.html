<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Calculador de sueldos</h1>

    <form action="">

        <label for="turno">Turno</label>
        <select name="turno" id="turno">
            <option value="matutino">Maturino</option>
            <option value="vespertino">Vespertino</option>
            <option value="nocturno">Nocturno</option>
        </select><br>

        <label for="horas">Horas</label>
        <input type="number" name="horas" id="horas"><br>

        <label for="pagoxhora">Pago por hora</label>
        <input type="number" name="pagoxhora" id="pagoxhora"><br>

        <label for="sueldo">Sueldo</label>
        <input type="text" name="sueldo" id="sueldo"><br>

        <button id="btncalcular">Calcular</button>

        <button id="btnlimpiar">Limpiar</button>

    </form>

    <script src="script.js"></script>
</body>
</html>
